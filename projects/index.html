<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Projects — Flattery Films</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/site.css">
<style>
  /* project cards: a still with its title; "coming soon" ones are dimmed */
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:28px;margin-top:8px}
  .card{display:block;text-decoration:none;color:var(--ink)}
  .card .pic{display:block;aspect-ratio:3/2;background:#151618 center/cover no-repeat;filter:grayscale(1) brightness(1.05);transition:filter .6s}
  a.card:hover .pic{filter:none}
  .card .name{display:block;margin-top:18px;font-size:14px;letter-spacing:.38em;text-transform:uppercase}
  .card .note{display:block;margin-top:8px;font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--dim)}
  .card.soon-card{opacity:.45;pointer-events:none}
  .page.wide{max-width:1100px}
</style>
</head>
<body>

<div class="page-hero" role="img" aria-label="Fly rods with bright feathered flies, from Thin Space in Costa Rica" style="background-image:url('../assets/img/stills/thin-space-costa-rica-rods.jpg');--pos:50% 45%"></div>
<main class="page wide">
  <h1>Projects</h1>
  <!-- One card per project. Give a card an href once its page exists (copy projects/thin-space/ as a starting point). -->
  <div class="cards">
    <a class="card" href="thin-space/"><span class="pic" style="background-image:url('../assets/img/stills/thin-space-scotland-kilts-street.jpg')"></span><span class="name">Thin Space</span><span class="note">Documentary series · 2026</span></a>
    <div class="card soon-card"><span class="pic" style="background-image:url('../assets/img/stills/wild-response-helicopter.jpg')"></span><span class="name">Wild Response</span><span class="note">Docuseries · coming soon</span></div>
    <div class="card soon-card"><span class="pic"></span><span class="name">Shelter</span><span class="note">Coming soon</span></div>
    <div class="card soon-card"><span class="pic"></span><span class="name">Sleeping Rough</span><span class="note">Coming soon</span></div>
  </div>
</main>

<script src="../assets/site.js"></script>
</body>
</html>
